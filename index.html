<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ของขวัญสุดพิเศษ 🎁</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
            overflow: hidden;
            position: relative;
        }

        /* การ์ดหลัก */
        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 35px 25px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.2);
            max-width: 90%;
            width: 380px;
            position: relative;
            z-index: 10;
            backdrop-filter: blur(5px);
            transition: transform 0.3s ease;
        }

        h2 {
            color: #d81b60;
            margin-bottom: 10px;
        }

        /* ซองจดหมายและท่าทางสั่นดุ๊กดิ๊ก */
        .envelope {
            font-size: 85px;
            cursor: pointer;
            display: inline-block;
            margin: 15px 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: bounce 2s infinite;
        }

        .envelope:hover {
            transform: scale(1.2) rotate(5deg);
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-15px) scale(1.05); }
            60% { transform: translateY(-7px); }
        }

        #hint {
            color: #888;
            font-size: 14px;
            animation: pulseText 1.5s infinite alternate;
        }

        @keyframes pulseText {
            from { opacity: 0.6; }
            to { opacity: 1; }
        }

        /* เนื้อหาที่ซ่อนไว้ */
        .hidden-content {
            display: none;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hidden-content.show {
            display: block;
            opacity: 1;
            transform: scale(1);
        }

        .hidden-content h3 {
            color: #ff4081;
            font-size: 22px;
            margin-bottom: 15px;
        }

        .hidden-content img {
            max-width: 100%;
            border-radius: 16px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            border: 4px solid #fff0f5;
        }

        /* เอฟเฟกต์หัวใจลอย */
        .heart {
            position: absolute;
            color: #ff4081;
            font-size: 20px;
            user-select: none;
            pointer-events: none;
            animation: floatUp 4s linear forwards;
            z-index: 1;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(100vh) scale(0.5);
                opacity: 1;
            }
            100% {
                transform: translateY(-10vh) scale(1.3) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="card">
    <h2>มีของขวัญมาส่งครับ! 🎁</h2>
    <div class="envelope" id="env" onclick="openGift()">✉️</div>
    <p id="hint">✨ แตะที่ซองจดหมายเพื่อเปิดดู ✨</p>

    <div class="hidden-content" id="giftContent">
        <h3>สุขสันต์วันพิเศษ! ❤️</h3>
        <img src="file_000000006df0823092de6e2b27600872.png" alt="รูปภาพของขวัญ">
    </div>
</div>

<script>
    function openGift() {
        // ยิงพลุกระดาษฉลอง
        confetti({
            particleCount: 120,
            spread: 70,
            origin: { y: 0.6 }
        });

        // ซ่อนซองจดหมายและคำใบ้
        document.getElementById('env').style.display = 'none';
        document.getElementById('hint').style.display = 'none';

        // แสดงเนื้อหาพร้อม Animation
        const content = document.getElementById('giftContent');
        content.classList.add('show');

        // สร้างเอฟเฟกต์หัวใจลอยกระจาย
        createHearts();
    }

    function createHearts() {
        const heartsContainer = document.body;
        for (let i = 0; i < 25; i++) {
            setTimeout(() => {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.innerHTML = ['❤️', '💖', '✨', '🌸', '💕'][Math.floor(Math.random() * 5)];
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = (Math.random() * 2 + 3) + 's';
                heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                heartsContainer.appendChild(heart);

                setTimeout(() => {
                    heart.remove();
                }, 5000);
            }, i * 150);
        }
    }
</script>

</body>
</html>
